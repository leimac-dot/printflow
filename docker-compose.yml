services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printflow_apache
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - printflow-net

  db:
    image: mysql:8.0
    container_name: printflow_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: printflow
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_USER: printflow_user
      MYSQL_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecretpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - printflow-net

volumes:
  mysql_data:

networks:
  printflow-net:
    driver: bridge
